<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Tetrafract v2</title>
<link rel="icon" href="data:,">
<style>
  :root { --panel: rgba(16, 18, 22, 0.8); --ink: #e9e6df; --dim: #a39d92; --accent: #e8a23c; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fb0bf; font: 13px/1.35 system-ui, -apple-system, Segoe UI, sans-serif; color: var(--ink); }
  canvas { display: block; touch-action: none; }
  #panel { position: fixed; top: 10px; left: 10px; width: 280px; max-width: calc(100vw - 20px); background: var(--panel); backdrop-filter: blur(8px); border-radius: 10px; padding: 10px 12px; box-shadow: 0 6px 24px rgba(0,0,0,.3); user-select: none; }
  h1 { font-size: 14px; margin: 0; display: flex; justify-content: space-between; align-items: center; }
  h1 small { color: var(--dim); font-weight: 400; }
  #collapse { background: none; border: 0; color: var(--dim); font-size: 16px; padding: 0 2px; cursor: pointer; }
  body.collapsed .body { display: none; }
  @media (max-width: 600px) { #panel { width: auto; right: 10px; padding: 8px 10px; } #stats { grid-template-columns: repeat(4, 1fr); } }
  .label { color: var(--dim); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; margin: 9px 0 5px; }
  .row { display: flex; flex-wrap: wrap; gap: 5px; }
  button { font: inherit; color: var(--ink); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.12); border-radius: 6px; padding: 5px 8px; cursor: pointer; }
  button:hover { background: rgba(255,255,255,.16); }
  button.on { background: var(--accent); color: #1d1406; border-color: var(--accent); }
  .slider { display: grid; grid-template-columns: 70px 1fr 56px; align-items: center; gap: 6px; margin: 3px 0; }
  .slider span:last-child { text-align: right; color: var(--dim); font-variant-numeric: tabular-nums; }
  input[type=range] { width: 100%; accent-color: var(--accent); }
  #stats { margin-top: 9px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px; text-align: center; }
  #stats div { background: rgba(255,255,255,.06); border-radius: 6px; padding: 3px 0; }
  #stats b { display: block; font-variant-numeric: tabular-nums; font-size: 12px; }
  #stats small { color: var(--dim); font-size: 10px; }
  .hint { color: var(--dim); font-size: 11px; margin-top: 7px; }
  #error { position: fixed; inset: 0; display: grid; place-items: center; padding: 24px; text-align: center; font-size: 16px; background: #1a1c22; white-space: pre-wrap; }
  #error[hidden] { display: none; }
  #loading { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); background: var(--panel); padding: 10px 16px; border-radius: 8px; }
  #loading[hidden] { display: none; }
  .versions { display: flex; gap: 4px; margin-top: 8px; }
  .versions a { flex: 1; text-align: center; font-size: 12px; text-decoration: none; color: var(--ink, #e8eaf0); background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.1); border-radius: 6px; padding: 4px 0; }
  .versions a.on { background: var(--accent, #f0a640); color: #1b1408; border-color: var(--accent, #f0a640); pointer-events: none; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
  "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.1/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <h1><span>Tetrafract <small>· v2 · GPU</small></span><button id="collapse" title="Collapse">☰</button></h1>
  <div class="versions"><a href="../../" class="" title="Back to the main demo">← Main demo</a><a href="./" class="on" title="Archived experiment">Archived v2</a></div>
  <div class="body">
    <div class="label">Scene</div>
    <div class="row" id="scenes"></div>
    <div class="label">Tap / click fires a projectile</div>
    <div class="slider"><span>Speed</span><input id="speed" type="range" min="5" max="70" step="1" value="32"><span id="speedv"></span></div>
    <div class="slider"><span>Size</span><input id="size" type="range" min="0.12" max="0.6" step="0.02" value="0.28"><span id="sizev"></span></div>
    <div class="slider"><span>Toughness</span><input id="tough" type="range" min="-1.5" max="1.5" step="0.05" value="0"><span id="toughv"></span></div>
    <div class="row" style="margin-top:7px">
      <button id="reset">Reset (R)</button>
      <button id="slow">Slow-mo (S)</button>
      <button id="pause">Pause (P)</button>
      <button id="quality" title="Lite = coarser pieces, fewer substeps (phones)"></button>
      <button id="action" hidden></button>
    </div>
    <div class="hint">Drag to orbit · pinch / wheel to zoom · two-finger / right drag to pan</div>
  </div>
  <div id="stats"></div>
</div>
<div id="loading">Building scene…</div>
<div id="error" hidden></div>
<script type="module" src="./main.js"></script>
</body>
</html>
