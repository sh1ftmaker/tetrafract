<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Undermine: Fort War</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, user-scalable=0">
<link rel="icon" href="data:,">
<style>
  * { -webkit-tap-highlight-color: transparent; user-select: none; box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #9fc3e6; font: 13px/1.3 system-ui, -apple-system, Segoe UI, sans-serif; color: #eef1f6; touch-action: none; }
  #appbody { position: fixed; inset: 0; }
  canvas { display: block; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; font-size: 18px; color: #1c2430; background: #9fc3e6; z-index: 50; padding: 24px; text-align: center; }
  #stats { position: fixed; top: 10px; left: 10px; display: grid; grid-template-columns: repeat(2, auto); gap: 2px 10px; background: rgba(16,20,28,.72); padding: 8px 10px; border-radius: 8px; z-index: 10; pointer-events: none; font-variant-numeric: tabular-nums; }
  #stats.hidden { display: none; }
  #stats div { display: contents; }
  #stats small { color: #9aa6b8; } #stats b { font-weight: 600; text-align: right; }
  #weapons { position: fixed; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 6px; z-index: 10; }
  #weapons div { background: rgba(16,20,28,.65); padding: 7px 10px; border-radius: 7px; border: 2px solid transparent; cursor: pointer; white-space: nowrap; }
  #weapons div.on { border-color: #f0a640; color: #fff; }
  #hint { position: fixed; bottom: 56px; left: 50%; transform: translateX(-50%); color: #fff; text-shadow: 0 1px 3px #000; z-index: 10; pointer-events: none; font-size: 12px; opacity: .85; text-align: center; }
  #firebtn { position: fixed; right: 24px; bottom: 90px; width: 76px; height: 76px; border-radius: 50%; background: rgba(240,166,64,.6); border: 2px solid #fff; z-index: 20; }
  #firebtn[hidden] { display: none; }
  .back, .front, [data-nipple] { -webkit-tap-highlight-color: transparent !important; outline: none !important; }
  @media (max-width: 600px) { #weapons div { padding: 6px 6px; font-size: 11px; } #stats { font-size: 11px; } }
</style>
</head>
<body>
<div id="crosshairs" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);width:24px;height:24px;pointer-events:none;display:none;z-index:1000">
  <div style="position:absolute;top:50%;left:0;width:100%;height:2px;background:rgba(255,255,255,.85);transform:translateY(-50%)"></div>
  <div style="position:absolute;left:50%;top:0;width:2px;height:100%;background:rgba(255,255,255,.85);transform:translateX(-50%)"></div>
</div>
<div id="info"></div>
<div id="loading">Loading...</div>
<div id="stats"></div>
<div id="hint">Click to play · WASD + mouse · Space jump · 1-5 / wheel weapons · H stats · M mute</div>
<div id="weapons"></div>
<button id="firebtn" hidden></button>
<div id="appbody"></div>
<script type="module" src="./dist/main.js?v=1792546324900"></script>
</body>
</html>
